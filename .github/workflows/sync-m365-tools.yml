name: Sync Microsoft 365 tool descriptions

on:
  schedule:
    # Nightly check that the pinned mcpToolDescription matches the live MCP server's tools/list
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate tool descriptions from live server
        id: generate
        env:
          SUPABASE_MCP_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node ./m365/scripts/generate-tools.mjs \
            > "$RUNNER_TEMP/supabase-tools.json"
          if ! jq -e . "$RUNNER_TEMP/supabase-tools.json" >/dev/null 2>&1; then
            echo "Generated tool descriptions are not valid JSON"
            exit 1
          fi
          # Guard the live output before it can become a PR (see
          # m365/scripts/check-package.py): every tool needs a non-empty
          # description and a non-empty inputSchema (properties required except
          # for the known zero-argument tools).
          python3 ./m365/scripts/check-package.py \
            --tools "$RUNNER_TEMP/supabase-tools.json"
          if ! diff -q "$RUNNER_TEMP/supabase-tools.json" ./m365/tools/supabase-tools.json >/dev/null; then
            mv "$RUNNER_TEMP/supabase-tools.json" ./m365/tools/supabase-tools.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: ${{ steps.generate.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-m365-tools
          delete-branch: true
          commit-message: "chore: sync m365 tool descriptions from mcp.supabase.com"
          title: "chore: sync m365 tool descriptions from mcp.supabase.com"
          body: |
            ## Summary
            - refresh `m365/tools/supabase-tools.json` (`mcpToolDescription`) from the live Supabase MCP server's `tools/list`

            ## Notes
            - generated by the `sync-m365-tools` workflow
            - does not change shared `skills/`
